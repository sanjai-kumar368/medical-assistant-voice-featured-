<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Medical Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <button class="back-btn" onclick="window.location.href='/'">← Back</button>

    <div class="app-container">
        <header class="app-header">
            <h1>🤖 AI Medical Assistant</h1>
            <p class="subtitle">Ask health-related questions and get instant responses</p>
        </header>

        <div class="card" style="max-width: 600px; margin: 0 auto; text-align: left;">
            <label for="ai-query"><strong>Enter your question:</strong></label>
            <textarea id="ai-query" rows="5"
                style="width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 4px;"
                placeholder="Example: I have a headache and fever, what should I do?"></textarea>

            <button class="primary-btn" style="margin-top: 15px;" onclick="askMedicalAI()">Ask AI</button>

            <div id="ai-response"
                style="margin-top: 20px; padding: 15px; border-radius: 8px; background: #f7f7f7; min-height: 60px;">
                Response will appear here.
            </div>
        </div>
    </div>

    <script>
        async function askMedicalAI() {
            const query = document.getElementById('ai-query').value.trim();
            const responseBox = document.getElementById('ai-response');

            if (!query) {
                alert('Please enter a question.');
                return;
            }

            try {
                const res = await fetch('/ai-medical', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                const data = await res.json();

                if (!res.ok) {
                    responseBox.innerHTML = `<span style="color:red;">${data.error || 'Something went wrong.'}</span>`;
                    return;
                }

                responseBox.textContent = data.response || 'No response returned.';
            } catch (error) {
                responseBox.innerHTML = `<span style="color:red;">Network error.</span>`;
            }
        }
    </script>
</body>
</html>
