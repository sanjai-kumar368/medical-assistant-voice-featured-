<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <button class="back-btn" onclick="window.location.href='/'">← Back</button>

    <div class="app-container">
        <header class="app-header">
            <h1>🔐 Doctor Login</h1>
            <p class="subtitle">Sign in to access doctor features</p>
        </header>

        <div class="card" style="max-width: 420px; margin: 0 auto; text-align: left;">
            <form id="doctor-login-form">
                <div style="margin-bottom: 15px;">
                    <label>Email:</label>
                    <input type="email" id="doctor-email"
                        style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;"
                        placeholder="doctor@example.com">
                </div>

                <div style="margin-bottom: 15px;">
                    <label>Password:</label>
                    <input type="password" id="doctor-password"
                        style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;"
                        placeholder="••••••••">
                </div>

                <button type="submit" class="primary-btn">Login</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('doctor-login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Login form submitted. Add authentication logic here.');
        });
    </script>
</body>
</html>
